spring.application.name=bikego-backend
server.port=8080
server.address=${BIKEGO_BIND_ADDRESS:127.0.0.1}

# Base de datos persistente para conservar cuentas, sesiones y viajes entre reinicios.
# Puede reemplazarse con BIKEGO_DB_URL al desplegar.
spring.datasource.url=${BIKEGO_DB_URL:jdbc:h2:file:./data/bikego;AUTO_SERVER=TRUE;LOCK_TIMEOUT=20000}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false

# Parametros de negocio (Plan de Requisitos v0.3)
bikego.radio-inicial-metros=1000
bikego.radio-maximo-metros=5000
bikego.bateria-minima=20
bikego.iot-timeout-ms=5000
bikego.iot-reintentos=2
bikego.bloqueo-pago-minutos=30
bikego.tarifa-base=1500
bikego.tarifa-minuto=250
bikego.velocidad-promedio-kmh=15
bikego.autonomia-maxima-km=60
bikego.sesion-horas=24
bikego.verificacion-minutos=15
bikego.mostrar-codigo-verificacion=${BIKEGO_MOSTRAR_CODIGO:true}

# Recargo COP para duración estrictamente mayor a cuatro horas.
bikego.recargo-largo=${BIKEGO_RECARGO_LARGO:10000}
