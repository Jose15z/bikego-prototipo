spring.application.name=bikego-backend
server.port=8080

# Base de datos en memoria. LOCK_TIMEOUT alto para que el segundo usuario espere al primero (CA-7).
spring.datasource.url=jdbc:h2:mem:bikego;LOCK_TIMEOUT=20000;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false

# Parametros de negocio (Plan de Requisitos v0.3)
bikego.radio-inicial-metros=1000
bikego.radio-maximo-metros=5000
bikego.bateria-minima=20
bikego.iot-timeout-ms=5000
bikego.iot-reintentos=2
bikego.bloqueo-pago-minutos=30
bikego.tarifa-base=1500
bikego.tarifa-minuto=250
bikego.velocidad-promedio-kmh=15
bikego.autonomia-maxima-km=60
